<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umoja Soccer Club — Site Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A;
    --gold:#F5C205;
    --gold-deep:#C99A02;
    --paper:#F1ECDE;
    --muted:#8A8578;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Archivo',system-ui,sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:clamp(2rem,6vw,5rem) 1.5rem;
    gap:clamp(1.4rem,3vw,2rem);
  }

  .logo{
    width:clamp(150px,26vw,240px);
    height:auto;
    opacity:0;
    animation:rise .9s .2s ease forwards;
  }

  .eyebrow{
    font-size:clamp(.7rem,1.6vw,.82rem);
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    opacity:0;
    animation:rise .7s .4s ease forwards;
  }

  .headline{
    font-family:'Anton',sans-serif;
    font-size:clamp(2.6rem,10vw,6.4rem);
    line-height:.92;
    letter-spacing:.02em;
    text-transform:uppercase;
    color:var(--paper);
    opacity:0;
    animation:rise .8s .5s ease forwards;
  }
  .headline span{color:var(--gold)}

  .tagline{
    max-width:36ch;
    font-size:clamp(1rem,2.4vw,1.25rem);
    line-height:1.5;
    color:var(--paper);
    opacity:0;
    animation:rise .8s .62s ease forwards;
  }
  .tagline b{color:var(--gold);font-weight:600}

  .socials{
    display:flex;
    gap:1.6rem;
    font-size:.85rem;
    letter-spacing:.05em;
    margin-top:.4rem;
    opacity:0;
    animation:rise .8s .74s ease forwards;
  }
  .socials a{
    color:var(--muted);
    text-decoration:none;
    text-transform:uppercase;
    transition:color .18s ease;
  }
  .socials a:hover,.socials a:focus-visible{color:var(--gold);outline:none}

  .foot{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:.7rem;
    padding:1.6rem;
    font-size:.72rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    flex-wrap:wrap;
  }
  .foot .dot{color:var(--gold-deep)}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .logo,.eyebrow,.headline,.tagline,.socials{opacity:1}
  }
</style>
</head>
